[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdth"
version = "1.0.1"
description = "Frequency distribution tables, histograms and polygons for numerical and categorical data"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "José Cláudio Faria", email = "joseclaudio.faria@gmail.com" },
]
maintainers = [
    { name = "José Cláudio Faria", email = "joseclaudio.faria@gmail.com" },
]
keywords = [
    "frequency-distribution",
    "histogram",
    "statistics",
    "fdt",
    "categorical",
    "numerical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs",
    "mypy",
    "black",
    "pdoc",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/jcfaria/fdth-python"
Repository = "https://github.com/jcfaria/fdth-python"
Issues = "https://github.com/jcfaria/fdth-python/issues"
Documentation = "https://github.com/jcfaria/fdth-python#readme"
PyPI = "https://pypi.org/project/fdth/"
"R package (original)" = "https://github.com/jcfaria/fdth"

[tool.setuptools.packages.find]
include = ["fdth*"]
exclude = ["tests*", "examples*", "w_todo*"]
